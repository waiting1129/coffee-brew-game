<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dawn Brew - 晨光萃取</title>
    <style>
        :root {
            --primary-color: #6d4c41;
            --accent-color: #d4a373;
            --bg-color: #fefae0;
            --sunlight: rgba(255, 255, 224, 0.4);
        }

        body {
            margin: 0;
            background: var(--bg-color);
            background-image: linear-gradient(120deg, var(--sunlight) 0%, transparent 40%),
                              radial-gradient(circle at top right, var(--sunlight) 0%, transparent 30%);
            font-family: "PingFang TC", "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            color: var(--primary-color);
        }

        /* 頂部資訊區 */
        header {
            margin-top: 30px;
            text-align: center;
            padding: 0 20px;
        }

        h1 { font-size: 1.5rem; letter-spacing: 2px; margin-bottom: 5px; }
        .bean-info { font-size: 0.9rem; color: #8d6e63; }

        /* 核心遊戲區域 */
        #stage {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* 虛擬濾杯視覺 */
        .dripper-view {
            width: 180px;
            height: 180px;
            border: 8px solid rgba(255,255,255,0.8);
            border-radius: 50%;
            position: relative;
            background: rgba(255,255,255,0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 水流指示器 (取代紅點) */
        #water-drop {
            width: 12px;
            height: 12px;
            background: #a8dadc;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 15px #457b9d;
            opacity: 0;
            transition: opacity 0.3s;
        }

        /* 穩定度計量器 - 環形設計 */
        .progress-container {
            position: absolute;
            bottom: 50px;
            width: 80%;
            text-align: center;
        }

        .bar-bg {
            width: 100%;
            height: 6px;
            background: rgba(0,0,0,0.1);
            border-radius: 3px;
            margin-top: 10px;
        }

        #bar-fill {
            width: 0%;
            height: 100%;
            background: var(--accent-color);
            border-radius: 3px;
            transition: width 0.1s;
        }

        /* 啟動按鈕 */
        #overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9);
            z-index: 100;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        button {
            padding: 15px 40px;
            font-size: 1.1rem;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        #feedback { font-size: 1.2rem; margin-top: 20px; min-height: 1.5em; }
    </style>
</head>
<body>

<div id="overlay">
    <h2>晨光中的第一杯</h2>
    <p>準備好練習穩定注水了嗎？<br>將手機水平握持，像握著壺把一樣。</p>
    <button id="start-btn">開始沖煮</button>
</div>

<header>
    <h1>DAWN BREW</h1>
    <div class="bean-info">正在沖煮：巴西 喜拉朵 (中烘焙)</div>
</header>

<div id="stage">
    <div class="dripper-view">
        <div id="water-drop"></div>
        <div style="color:rgba(255,255,255,0.5); font-size: 0.8rem;">V60 DRIER</div>
    </div>
    <div id="feedback">請微傾手機開始注水</div>
    
    <div class="progress-container">
        <div id="brew-status">穩定度：0%</div>
        <div class="bar-bg">
            <div id="bar-fill"></div>
        </div>
    </div>
</div>

<script>
    const waterDrop = document.getElementById('water-drop');
    const barFill = document.getElementById('bar-fill');
    const feedback = document.getElementById('feedback');
    const brewStatus = document.getElementById('brew-status');
    const overlay = document.getElementById('overlay');
    
    let stability = 0;
    let isBrewing = false;

    document.getElementById('start-btn').addEventListener('click', () => {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission().then(state => {
                if (state === 'granted') startApp();
            });
        } else {
            startApp();
        }
    });

    function startApp() {
        overlay.style.display = 'none';
        isBrewing = true;
        window.addEventListener('deviceorientation', handleMotion);
    }

    function handleMotion(e) {
        if (!isBrewing) return;

        // Beta 是前後傾斜 (倒水動作)
        // Gamma 是左右傾斜 (繞圈動作)
        let tiltForward = e.beta; 
        let tiltSide = e.gamma;

        // 模擬注水啟動：當手機往前傾斜超過 15 度時開始注水
        if (tiltForward > 15) {
            waterDrop.style.opacity = 1;
            
            // 計算偏移，模擬水流擊中點
            let x = tiltSide * 2;
            let y = (tiltForward - 30) * 2; // 假設 30 度是最佳注水角
            
            waterDrop.style.transform = `translate(${x}px, ${y}px)`;

            // 穩定度判定
            let dist = Math.sqrt(x*x + y*y);
            if (dist < 25) {
                stability += 0.4;
                feedback.innerText = "✨ 水流非常穩定";
                feedback.style.color = "#2a9d8f";
            } else {
                stability -= 0.2;
                feedback.innerText = "⚠️ 水流偏移了";
                feedback.style.color = "#e76f51";
            }
        } else {
            waterDrop.style.opacity = 0;
            feedback.innerText = "請向前微傾模擬注水";
            feedback.style.color = "#6d4c41";
        }

        stability = Math.max(0, Math.min(100, stability));
        barFill.style.width = stability + "%";
        brewStatus.innerText = `穩定度：${Math.floor(stability)}%`;

        if (stability >= 100) {
            isBrewing = false;
            feedback.innerText = "🎉 沖煮完成！甘甜感十足。";
            setTimeout(() => alert("這杯巴西豆展現了完美的核果風味！"), 500);
        }
    }
</script>
</body>
</html>
