<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>晨光萃取 Dawn Brew - 虛擬助教版</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #f5e6ca 0%, #d4a373 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            color: #432818;
        }

        #game-info {
            margin-top: 20px;
            text-align: center;
            z-index: 10;
        }

        /* 虛擬水平儀 */
        #level-container {
            width: 200px;
            height: 200px;
            border: 4px solid #432818;
            border-radius: 50%;
            position: relative;
            margin: 40px auto;
            background: rgba(255, 255, 255, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #target-ring {
            width: 40px;
            height: 40px;
            border: 2px dashed #008000;
            border-radius: 50%;
            position: absolute;
        }

        #bubble {
            width: 20px;
            height: 20px;
            background-color: #e63946;
            border-radius: 50%;
            position: absolute;
            transition: transform 0.1s ease-out;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* 穩定度計量條 */
        #stability-bar-container {
            width: 80%;
            height: 30px;
            background: #eee;
            border-radius: 15px;
            border: 2px solid #432818;
            overflow: hidden;
            margin-top: 20px;
        }

        #stability-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ffb703, #fb8500);
            transition: width 0.3s;
        }

        .perfect-glow {
            box-shadow: 0 0 20px #fb8500;
        }

        #status {
            font-weight: bold;
            margin-top: 10px;
            font-size: 1.2rem;
        }

        button {
            padding: 15px 30px;
            font-size: 1rem;
            background-color: #432818;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div id="game-info">
    <h2>晨光萃取：V60 穩定度練習</h2>
    <p>豆子：巴西 喜拉朵 (入門級)</p>
    <div id="status">等待啟動...</div>
</div>

<div id="level-container">
    <div id="target-ring"></div>
    <div id="bubble"></div>
</div>

<div id="stability-bar-container">
    <div id="stability-fill"></div>
</div>

<button id="start-btn">點擊啟動陀螺儀感測</button>

<script>
    const bubble = document.getElementById('bubble');
    const status = document.getElementById('status');
    const fill = document.getElementById('stability-fill');
    const startBtn = document.getElementById('start-btn');
    
    let stability = 0;
    let isGaming = false;

    // 啟動感測器（iOS 需要授權）
    startBtn.addEventListener('click', () => {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') {
                        initGame();
                    }
                })
                .catch(console.error);
        } else {
            initGame();
        }
    });

    function initGame() {
        isGaming = true;
        startBtn.style.display = 'none';
        status.innerText = "正在悶蒸中...保持穩定！";
        window.addEventListener('deviceorientation', handleOrientation);
    }

    function handleOrientation(event) {
        if (!isGaming) return;

        // 獲取手機傾斜數值
        let x = event.beta;  // 前後傾斜 (-180 到 180)
        let y = event.gamma; // 左右傾斜 (-90 到 90)

        // 限制在水平儀範圍內 (簡化運算)
        let moveX = Math.max(-90, Math.min(90, y)) * 1; 
        let moveY = Math.max(-90, Math.min(90, x - 45)) * 1; // 假設 45 度是舒適握姿

        bubble.style.transform = `translate(${moveX}px, ${moveY}px)`;

        // 判定穩定度：如果紅點距離中心很近
        let distance = Math.sqrt(moveX * moveX + moveY * moveY);
        
        if (distance < 20) { // 進入黃金環
            stability += 0.5;
            status.innerText = "完美萃取中！✨";
            status.style.color = "#008000";
            fill.classList.add('perfect-glow');
        } else {
            stability -= 0.2;
            status.innerText = "手抖了！調整角度...";
            status.style.color = "#e63946";
            fill.classList.remove('perfect-glow');
        }

        stability = Math.max(0, Math.min(100, stability));
        fill.style.width = stability + "%";

        if (stability >= 100) {
            isGaming = false;
            status.innerText = "成功完成 30 秒悶蒸！解鎖耶加雪菲。";
            alert("恭喜！你帶出了巴西豆的堅果甜感！");
        }
    }
</script>

</body>
</html>
